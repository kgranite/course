<!DOCTYPE html>
<html>
<body>
    <h2>Account Registration (5-Column Address)</h2>
    <form method="POST" action="/register_account">
        <input type="text" name="pps" placeholder="PPS Number" required><br><br>
        <input type="date" name="dob" required><br><br>
        <input type="password" name="password" placeholder="Password" required><br><br>
        <input type="text" name="govid" placeholder="GovID (Optional)"><br><br>
        
        <input type="text" name="line1" placeholder="Line 1" required><br><br>
        <input type="text" name="line2" placeholder="Line 2"><br><br>
        <input type="text" name="town" placeholder="Town (3rd)" required><br><br>
        <input type="text" name="county" placeholder="County (4th)" required><br><br>
        <input type="text" name="eircode" placeholder="Eircode (5th)" required><br><br>
        
        <button type="submit">Register</button>
    </form>
    <br>
    <a href="/">Back to Courses</a>
</body>
</html>
